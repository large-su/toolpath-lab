[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toolpath-lab"
version = "0.1.0"
description = "A small CAM workbench: import STEP parts, create stock, build an operation tree, mill (face/pocket) with automatic toolpaths, simulate stock removal, and export NC — plus a raster toolpath planning base with a desktop 3D viewer."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ToolpathLab contributors" }]
keywords = ["cam", "toolpath", "milling", "step", "stl", "stock", "simulation", "raster", "manufacturing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.26",
  # BRep：STEP/IGES 解析、拓扑、修复、切片、转网格
  "cadquery-ocp>=7.7",
  # 2.5D 轮廓布尔与偏置、型腔环切
  "pyclipper>=1.3",
  # 3 轴曲面刀路（只吃三角网格）
  "opencamlib>=2023.1",
  # 三角网格预处理 / 校验 / 导出
  "trimesh>=4.0",
  # DXF 2D 轮廓读取
  "ezdxf>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
toolpath-lab = "toolpath_lab.cli:main"

[project.urls]
Homepage = "https://github.com/large-su/toolpath-lab"
Issues = "https://github.com/large-su/toolpath-lab/issues"

[tool.setuptools.packages.find]
include = ["toolpath_lab*"]

[tool.setuptools.package-data]
toolpath_lab = ["web/*.html", "web/*.css", "web/*.png", "web/*.ico", "web/js/*.js", "web/vendor/*.js"]
examples = ["*.step"]

[tool.pytest.ini_options]
testpaths = ["tests"]
