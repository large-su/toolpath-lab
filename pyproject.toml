[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toolpath-lab"
version = "0.0.2"
description = "A deliberately small toolpath planning base: flat/ball/bull-nose tools, square/circle regions, planar or curved (height-field) machining surfaces, zigzag/one-way raster and scallop-height surface finishing, with a desktop 3D viewer and feed-rate playback."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ToolpathLab contributors" }]
keywords = ["cam", "toolpath", "milling", "raster", "zigzag", "surface-finishing", "ball-nose", "scallop", "robotics", "manufacturing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
toolpath-lab = "toolpath_lab.cli:main"

[project.urls]
Homepage = "https://github.com/large-su/toolpath-lab"
Issues = "https://github.com/large-su/toolpath-lab/issues"

[tool.setuptools.packages.find]
include = ["toolpath_lab*"]

[tool.setuptools.package-data]
toolpath_lab = ["web/*.html", "web/*.css", "web/*.png", "web/*.ico", "web/js/*.js", "web/vendor/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
