name: selfcheck

# Runs exactly what contributors run locally (`python selfcheck.py`), so a branch that breaks the
# tests, the front-end syntax or the HTTP API is visible on the pull request instead of on the
# teacher's machine. See CONTRIBUTING.md for the same command in the terminal.
on:
  push:
  pull_request:

jobs:
  selfcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run the pre-commit self-check
        run: python selfcheck.py
